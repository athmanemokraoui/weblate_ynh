# https://github.com/WeblateOrg/weblate/blob/main/weblate/examples/weblate.nginx.gunicorn.conf
# Weblate 5.15.2+ no longer serves screenshots via /media/ directly through nginx
# (CVE-2026-21889 / GHSA-3g2f-4rjg-9385). Django now serves them with proper auth.
location ~ ^__PATH__/favicon.ico$ {
    # CACHE_DIR/static/favicon.ico
    alias __INSTALL_DIR__/data/cache/static/favicon.ico;
    expires 30d;
}

location __PATH__/static/ {
    # CACHE_DIR/static/
    alias __INSTALL_DIR__/data/cache/static/;
    expires 30d;
}

# /media/ location removed in Weblate 5.15.2 — Django now serves media files
# (including screenshots) with proper authentication, fixing CVE-2026-21889.

location __PATH__/ {
    proxy_pass http://unix:/run/__APP__.sock;
    include proxy_params_no_auth;
    proxy_read_timeout 3600;
}
